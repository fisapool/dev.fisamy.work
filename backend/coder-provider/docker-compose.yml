version: '3.8'

services:
  # PostgreSQL database for Coder
  postgres:
    image: postgres:15-alpine
    container_name: coder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: coder
      POSTGRES_USER: coder
      POSTGRES_PASSWORD: ${CODER_PG_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coder"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coder-network

  # Coder server
  coder:
    image: codercom/coder:latest
    container_name: coder-server
    restart: unless-stopped
    environment:
      CODER_ACCESS_URL: ${CODER_ACCESS_URL}
      CODER_PG_CONNECTION_STRING: postgres://coder:${CODER_PG_PASSWORD}@postgres:5432/coder?sslmode=disable
      CODER_TELEMETRY: "false"
      CODER_UPDATE_CHECK: "false"
      # Resource limits for workspaces
      CODER_MAX_WORKSPACE_CPUS: ${CODER_MAX_WORKSPACE_CPUS:-6}
      CODER_MAX_WORKSPACE_MEMORY: ${CODER_MAX_WORKSPACE_MEMORY:-16Gi}
      CODER_MAX_WORKSPACE_DISK: ${CODER_MAX_WORKSPACE_DISK:-100Gi}
      CODER_DEFAULT_WORKSPACE_IDLE_TIMEOUT: ${CODER_DEFAULT_WORKSPACE_IDLE_TIMEOUT:-30m}
      # Security settings
      CODER_SESSION_DURATION: "24h"
      CODER_SIGNING_KEY: ${CODER_SIGNING_KEY:-}
    volumes:
      - coder_data:/home/coder
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - coder-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Caddy reverse proxy
  caddy:
    image: caddy:2-alpine
    container_name: coder-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - coder
    networks:
      - coder-network

  # Redis for session management (optional, for scaling)
  redis:
    image: redis:7-alpine
    container_name: coder-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - coder-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  coder_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  redis_data:
    driver: local

networks:
  coder-network:
    name: coder-network
    driver: bridge
