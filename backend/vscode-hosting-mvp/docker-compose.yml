version: '3.8'

services:
  # OpenVSCode server for Alice
  alice-openvscode:
    image: ghcr.io/gitpod-io/openvscode-server:latest
    container_name: alice-openvscode
    restart: unless-stopped
    environment:
      - OPENVSCODE_SERVER_CONNECTION_TOKEN=alice-token-123
    volumes:
      - alice_workspace:/home/workspace
    ports:
      - "3001:3000"
    command: >
      sh -c "
        /openvscode-server/bin/openvscode-server 
        --host 0.0.0.0 
        --port 3000 
        --connection-token alice-token-123
      "

  # OpenVSCode server for Bob (example of adding users)
  bob-openvscode:
    image: ghcr.io/gitpod-io/openvscode-server:latest
    container_name: bob-openvscode
    restart: unless-stopped
    environment:
      - OPENVSCODE_SERVER_CONNECTION_TOKEN=bob-token-456
    volumes:
      - bob_workspace:/home/workspace
    ports:
      - "3002:3000"
    command: >
      sh -c "
        /openvscode-server/bin/openvscode-server 
        --host 0.0.0.0 
        --port 3000 
        --connection-token bob-token-456
      "

  # Caddy reverse proxy with basic auth
  caddy:
    image: caddy:2-alpine
    container_name: caddy-mvp
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - alice-openvscode
      - bob-openvscode

volumes:
  alice_workspace:
    driver: local
  bob_workspace:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  default:
    name: vscode-mvp-network
